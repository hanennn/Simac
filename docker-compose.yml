services:

  postgres:
    image: postgres:15-alpine
    container_name: simac-postgres
    environment:
      POSTGRES_DB: db_Simac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simac-backend
    depends_on:
      postgres:
        condition: service_healthy
      odoo:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_Simac
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456789"
      JWT_SECRET: "ZmFrZUtleUZvckRldkVudmlyb25tZW50T25seU5vdEZvclByb2R1Y3Rpb25Vc2FnZQ=="
      SPRING_MAIL_USERNAME: hanen.bennaceur@esprit.tn
      SPRING_MAIL_PASSWORD: "etrj ocsw ltkb hpwq"
      ODOO_URL: http://odoo:8069
      ODOO_DB: simac
      ODOO_USERNAME: hanenbennaceur115@gmail.com
      ODOO_PASSWORD: "123456789"
      SPRING_AI_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8081:8081"

  odoo-db:
    image: postgres:15-alpine
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17
    container_name: odoo-simac
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo

volumes:
  postgres_data:
  odoo_db_data:
  odoo_data: