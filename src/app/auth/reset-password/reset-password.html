<div class="page-container">
  <div class="otp-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
        </svg>
      </div>
      <h1 class="app-name">SIMAC</h1>
      <p class="subtitle">Saisissez le code reçu et votre nouveau mot de passe</p>
    </div>

    <form (ngSubmit)="reinitialiser()" class="otp-form">
      <div class="field-group">
        <label for="code">Code reçu par email</label>
        <input
          type="text"
          id="code"
          name="code"
          [(ngModel)]="code"
          placeholder="123456"
          maxlength="6"
          required
        />
      </div>

      <div class="field-group">
        <label for="nouveauMotDePasse">Nouveau mot de passe</label>
        <input
          type="password"
          id="nouveauMotDePasse"
          name="nouveauMotDePasse"
          [(ngModel)]="nouveauMotDePasse"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="erreur-message" *ngIf="message()">{{ message() }}</div>

      <button type="submit" class="btn-verifier" [disabled]="etat.chargement()">
        {{ etat.chargement() ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>
  </div>
</div>
