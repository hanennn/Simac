<div class="page-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
        </svg>
      </div>
      <h1 class="app-name">SIMAC</h1>
      <p class="subtitle">Mot de passe oublié ? Saisissez votre email pour recevoir un code</p>
    </div>

    <form (ngSubmit)="envoyer()" class="login-form">
      <div class="field-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="nom@entreprise.com"
          required
        />
      </div>

      <div class="erreur-message" *ngIf="message()">{{ message() }}</div>

      <button type="submit" class="btn-connexion" [disabled]="etat.chargement()">
        {{ etat.chargement() ? 'Envoi...' : 'Envoyer le code' }}
      </button>

      <p class="footer-text">
        <a routerLink="/login">Retour à la connexion</a>
      </p>
    </form>
  </div>
</div>
