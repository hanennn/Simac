<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-seal">
      <img src="images/logo-simac.png" alt="Logo SIMAC" class="sidebar-logo-img">
    </div>
    <div>
      <div class="sidebar-brand-name">SIMAC</div>
      <div class="sidebar-brand-sub">Espace admin</div>
    </div>
  </div>

  <nav class="side-nav">
    <a class="side-link" routerLink="/dashboard" routerLinkActive="active">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1.5"/>
        <rect x="14" y="3" width="7" height="5" rx="1.5"/>
        <rect x="14" y="12" width="7" height="9" rx="1.5"/>
        <rect x="3" y="16" width="7" height="5" rx="1.5"/>
      </svg>
      Tableau de bord
    </a>

    <a class="side-link" routerLink="/utilisateurs" routerLinkActive="active" *ngIf="utilisateur()?.role === 'ADMIN'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="7" r="3.2"/>
        <path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>
        <circle cx="17" cy="8" r="2.6"/>
        <path d="M15.5 14.6c2.6.3 4.5 2.2 4.5 5.4"/>
      </svg>
      Utilisateurs
    </a>

    <a class="side-link" routerLink="/departements" routerLinkActive="active" *ngIf="utilisateur()?.role === 'ADMIN'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="9" height="18"/>
        <rect x="13" y="8" width="7" height="13"/>
        <path d="M7 7h1M7 11h1M7 15h1M16 12h1M16 16h1"/>
      </svg>
      Départements
    </a>

    <a class="side-link" routerLink="/budgets" routerLinkActive="active" *ngIf="utilisateur()?.role === 'RESPONSABLE_FINANCIER'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12l5 5L20 6"/>
      </svg>
      Validation des dépenses
    </a>

    <a class="side-link" routerLink="/mes-depenses" routerLinkActive="active" *ngIf="utilisateur()?.role === 'CHEF_DEPARTEMENT'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="1.5"/>
        <path d="M9 8h6M9 12h6M9 16h4"/>
      </svg>
      Mes dépenses
    </a>

  </nav>

  <div class="sidebar-footer">
    <div class="user-chip-mini">
      <div class="user-avatar-mini">{{ (utilisateur()?.prenom?.[0] || '') + (utilisateur()?.nom?.[0] || '') }}</div>
      <div class="user-chip-mini-text">
        <div class="user-chip-mini-name">{{ utilisateur()?.prenom }} {{ utilisateur()?.nom }}</div>
        <div class="user-chip-mini-role">{{ utilisateur()?.role }}</div>
      </div>
    </div>
    <a class="side-link" (click)="seDeconnecter()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <path d="M16 17l5-5-5-5M21 12H9"/>
      </svg>
      Déconnexion
    </a>
  </div>
</aside>
