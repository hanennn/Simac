<div class="page-container">
  <div class="otp-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
        </svg>
      </div>
      <h1 class="app-name">SIMAC</h1>
      <p class="subtitle">Un code de vérification a été envoyé à<br><strong>{{ email }}</strong></p>
    </div>

    <form (ngSubmit)="verifier()" class="otp-form">
      <div class="field-group">
        <label for="code">Code de vérification</label>
        <input
          type="text"
          id="code"
          name="code"
          [(ngModel)]="code"
          placeholder="123456"
          maxlength="6"
          required
        />
      </div>

      <div class="erreur-message" *ngIf="erreur()">{{ erreur() }}</div>

        <button type="submit" class="btn-verifier" [disabled]="chargement()">
        {{ chargement() ? 'Vérification...' : 'Valider le code' }}
        </button>

      <p class="footer-text">Le code est valide pendant 5 minutes</p>
    </form>
  </div>
</div>
