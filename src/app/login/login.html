<div class="page-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
        </svg>
      </div>
      <h1 class="app-name">SIMAC</h1>
      <p class="subtitle">Suivi budgétaire — connexion à votre espace département</p>
    </div>

    <form (ngSubmit)="seConnecter()" class="login-form">
      <div class="field-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="nom@entreprise.com"
          required
        />
      </div>

      <div class="field-group">
        <label for="motDePasse">Mot de passe</label>
        <input
          type="password"
          id="motDePasse"
          name="motDePasse"
          [(ngModel)]="motDePasse"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="seSouvenir" name="seSouvenir" />
          Se souvenir de moi
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
      </div>

     <div class="erreur-message" *ngIf="erreur()">{{ erreur() }}</div>

        <button type="submit" class="btn-connexion" [disabled]="chargement()">
        {{ chargement() ? 'Connexion...' : 'Se connecter' }}
        </button>

      <p class="footer-text">Accès réservé aux responsables de département</p>
    </form>
  </div>
</div>
